<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide Mate Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <!--left panel-->
        <div class="left-panel">
            <img src="img/logoo.png"
            class="logo"
            alt="Guide Mate">

            <h1> Guide mate</h1>

            <h2> Your bride to authentic travel experiences.</h2>
            <p>
                Join a  community of travellers exploring  the worlds
                best destination with the experts local guides .
            </p>

            <div class="stats">
                <div>
                    <h3>4.9/5</h3> 
                    <span> Average Rating </span>
                  </div>
                  <div>
                    <h3>120 +</h3> 
                    <span> Countries </span>
                  </div>
                </div>
            </div>



            <!-- for right panel -->
            <div class="right-panel">
                <div class="tabs">
    <a href="login.html" class="tab active">Login</a>
    <a href="signup.html" class="tab">Sign Up</a>
</div>
                <h2>Welcome back</h2>
                <p>Login to continue your journey</p>

                <form id="loginForm" onsubmit="event.preventDefault(); window.location.href='home.html';">
                    <label>Email Address</label>
                    <input type="email" placeholder="suvashan@example.com">

                    <label>Password</label>
                    <input type="password" placeholder="***********">

                    <button type="submit" class="login-btn">Login</button>
                </form>

                <div class="divider">OR CONTINUE WITH</div>
                   <div class="social">

    <button type="button" class="social-btn google-btn">
        <i class="fa-brands fa-google"></i>
        <span>Google</span>
    </button>

    <button type="button" class="social-btn facebook-btn">
        <i class="fa-brands fa-facebook-f"></i>
        <span>Facebook</span>
    </button>

</div>
                </div>
            </div>
    </div>
    
</body>
</html>
