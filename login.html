<!DOCTYPE html>
<html lang="en">
<>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide Mate Login</title>
    <link rel="stylesheet" href="css/login.css">
    
</head>
<body>
    <div class="login-container">
        <!--left panel-->
        <div class="left-panel">
            <img src="img/logoo.png"
            class="logo"
            alt="Guide Mate">

            <h1> Guide mate</h1>

            <h2> Your bride to authentic travel experiences.</h2>
            <p>
                Join a  community of travellers exploring  the worlds
                best destination with the experts local guides .
            </p>

            <div class="stats">
                <div>
                    <h3>4.9/5</h3> 
                    <span> Average Rating </span>
                  </div>
                  <div>
                    <h3>120 +</h3> 
                    <span> Countries </span>
                  </div>
                </div>
            </div>
            <!-- for right panel -->
             <<div class="right-panel">
                <div class="tabs">
                    <button class="active"> Login

                    </button>

                    <button> Sign Up </button>
                </div>

                <h2> Welcome back </h2>
                <p> Login to continue your journey</p>
                <form>
                    <label> Email Address </label>
                    <input
                    type="email"
                    placeholder="suvashan@example.com">

                    <label> Password </label>

                    <input
                    type="password"
                    placeholder="***********">
                    
                    <button
                        type="submit"
                    class="login-btn">
                 Login </button>
                    
                 
                    
                </form>


                <div class="divider">
                    OR CONTINUE WITH 

                </div>

                <div  class="social">
                    <button>
                        Google

                    </button>

                    <button>
                        Facebook
                    </button>
                </div>
        </div>
    </div>
    
</body>
</html>
