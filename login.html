<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide Mate Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <!--left panel-->
        <div class="left-panel">
            <img src="img/logoo.png"
            class="logo"
            alt="Guide Mate">

            <h1> Guide mate</h1>

            <h2> Your bride to authentic travel experiences.</h2>
            <p>
                Join a  community of travellers exploring  the worlds
                best destination with the experts local guides .
            </p>

            <div class="stats">
                <div>
                    <h3>4.9/5</h3> 
                    <span> Average Rating </span>
                  </div>
                  <div>
                    <h3>120 +</h3> 
                    <span> Countries </span>
                  </div>
                </div>
            </div>
            <!-- for right panel -->
            <div class="right-panel">
                <div class="tabs">
                    <button class="active">Login</button>
                    <button>Sign Up</button>
                </div>

                <h2>Welcome back</h2>
                <p>Login to continue your journey</p>

                <form id="loginForm" onsubmit="event.preventDefault(); window.location.href='home.html';">
                    <label>Email Address</label>
                    <input type="email" placeholder="suvashan@example.com">

                    <label>Password</label>
                    <input type="password" placeholder="***********">

                    <button type="submit" class="login-btn">Login</button>
                </form>

                <div class="divider">OR CONTINUE WITH</div>

                <div class="social">
                    <button type="button" class="social-btn google-btn">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"></path>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path>
                            <path fill="#FBBC05" d="M5.84 13.99c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.97H2.18C1.43 9.35 1 10.9 1 12.5s.43 3.15 1.18 4.53l3.66-2.54z"></path>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.97l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"></path>
                        </svg>
                        <span>Google</span>
                    </button>

                    <button type="button" class="social-btn facebook-btn">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="#1877F2" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.01 1.79-4.67 4.53-4.67 1.31 0 2.68.24 2.68.24v2.95h-1.51c-1.49 0-1.95.93-1.95 1.88v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"></path>
                        </svg>
                        <span>Facebook</span>
                    </button>
                </div>
            </div>
    </div>
    
</body>
</html>
